<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff; overflow: hidden;
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  .title { font-size: 72px; font-weight: 800; letter-spacing: -2px; }
  .title span { color: #ff4136; }
  .tagline { font-size: 28px; color: #8a8a9a; margin-top: 12px; }
  .stats { display: flex; gap: 48px; margin-top: 32px; }
  .stat-num { font-size: 32px; font-weight: 700; color: #ff4136; }
  .stat-label { font-size: 16px; color: #8a8a9a; }
  .badge { background: rgba(255,65,54,0.15); color: #ff4136; padding: 8px 20px; border-radius: 20px; font-size: 18px; margin-top: 24px; }
</style>
</head>
<body>
  <div class="icon">⚔</div>
  <div class="title">Duel<span>Stake</span></div>
  <div class="tagline">Find opponents. Set stakes. Prove your skill.</div>
  <div class="stats">
    <div><div class="stat-num">50K+</div><div class="stat-label">Players</div></div>
    <div><div class="stat-num">6</div><div class="stat-label">Games</div></div>
    <div><div class="stat-num">1v1</div><div class="stat-label">Duels</div></div>
  </div>
  <div class="badge">Competitive Gaming Platform</div>
</body>
</html>
