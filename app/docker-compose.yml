services:
  app:
    container_name: stz-duelstake-app
    build: .
    image: stz-duelstake:latest
    ports:
      - "127.0.0.1:4004:4004"
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: postgresql://duelstake_app:${DUELSTAKE_DB_PASSWORD}@stz-shared-db:5432/stz_duelstake
      REDIS_URL: redis://:${REDIS_PASSWORD}@stz-shared-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - stz-duelstake-uploads:/app/data/uploads
    networks:
      - stz-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4004/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      stz.project: "stuzzicadenti-ag"
      stz.service: "duelstake"

volumes:
  stz-duelstake-uploads:
    name: stz-duelstake-uploads

networks:
  stz-net:
    external: true
