version: "3.8"
services:
  app:
    container_name: stz-duelstake-app
    build: .
    image: stz-duelstake:latest
    ports:
      - "0.0.0.0:4004:4004"
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: postgresql://duelstake_app:duelstake_pass@stz-shared-db:5432/stz_duelstake
      REDIS_URL: redis://stz-shared-redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - stz-duelstake-uploads:/app/data/uploads
    networks:
      - stz-net
    restart: unless-stopped
    labels:
      stz.project: "stuzzicadenti-ag"
      stz.service: "duelstake"

volumes:
  stz-duelstake-uploads:
    name: stz-duelstake-uploads

networks:
  stz-net:
    external: true
